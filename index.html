<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08100b"><title>Carte PAMPA PARIS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#ead6c5;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
main{width:100%;margin:0 auto}.menu{display:block;width:100%;height:auto;border:0}
@media(min-width:900px){main{max-width:900px}}
.intro{position:fixed;inset:0;z-index:10;background:#061009;overflow:hidden;display:grid;place-items:center;isolation:isolate;opacity:1;transition:opacity .55s ease,visibility .55s ease}
.intro.hidden{opacity:0;visibility:hidden;pointer-events:none}
.intro img{width:100%;height:100%;object-fit:contain;display:block;animation:cinematicReveal 2.35s cubic-bezier(.18,.62,.28,1) both;will-change:transform,filter,opacity}
.intro::before{content:"";position:absolute;inset:-35%;z-index:2;pointer-events:none;background:radial-gradient(ellipse 8% 36% at 50% 50%,rgba(255,252,223,.68) 0%,rgba(255,216,132,.26) 32%,transparent 76%);mix-blend-mode:screen;filter:blur(14px);transform:translateX(-90%) rotate(-20deg);animation:goldenGlide 2.15s ease-in-out .15s both}
.intro::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(110deg,transparent 34%,rgba(255,240,188,.21) 49%,transparent 61%);transform:translateX(-160%);animation:goldenSweep 2s ease-in-out .2s both}
.sparkles{position:absolute;inset:0;z-index:4;pointer-events:none}
.sparkles i{position:absolute;display:block;width:3px;height:3px;border-radius:50%;background:#fff3c5;box-shadow:0 0 7px 3px rgba(255,211,125,.55);opacity:0;animation:twinkle 1.3s ease-in-out both}
.sparkles i:nth-child(1){left:44%;top:25%;animation-delay:.65s}
.sparkles i:nth-child(2){left:57%;top:35%;animation-delay:.85s;width:2px;height:2px}
.sparkles i:nth-child(3){left:39%;top:53%;animation-delay:1.1s}
.sparkles i:nth-child(4){left:62%;top:64%;animation-delay:1.3s;width:2px;height:2px}
.sparkles i:nth-child(5){left:51%;top:74%;animation-delay:1.45s}
@keyframes cinematicReveal{0%{opacity:0;transform:scale(1.075);filter:brightness(.48) saturate(.75)}25%{opacity:1}65%{filter:brightness(1.14) saturate(1.08)}100%{opacity:1;transform:scale(1.015);filter:brightness(1) saturate(1)}}
@keyframes goldenGlide{0%{opacity:0;transform:translateX(-90%) rotate(-20deg)}25%{opacity:.85}75%{opacity:.85}100%{opacity:0;transform:translateX(90%) rotate(-20deg)}}
@keyframes goldenSweep{0%{opacity:0;transform:translateX(-160%)}30%{opacity:1}100%{opacity:0;transform:translateX(160%)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}40%{opacity:.85;transform:scale(1.15)}70%{opacity:.3;transform:scale(.7)}}
@media(prefers-reduced-motion:reduce){.intro img,.intro::before,.intro::after,.sparkles i{animation:none}.intro{transition:none}}
</style></head><body>
<div class="intro" id="intro" aria-label="Bienvenue à La Pampa"><img src="./LOGO%201.png?v=432dd9c8" alt="Visuel d’accueil La Pampa" fetchpriority="high"><div class="sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
<main><img class="menu" src="./CARTE.PNG" alt="Carte PAMPA PARIS : menu, cocktails, vins, spiritueux et boissons"></main>
<script>
(function(){
const intro=document.getElementById('intro');
const start=performance.now();
const dismiss=()=>{const remaining=Math.max(0,2400-(performance.now()-start));setTimeout(()=>{intro.classList.add('hidden');setTimeout(()=>intro.remove(),600)},remaining)};
if(document.readyState==='complete')dismiss();else window.addEventListener('load',dismiss,{once:true});
setTimeout(dismiss,3800);
})();
</script></body></html>
